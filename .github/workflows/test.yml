name: Test Builds

on:
  push:
    branches: [ development, master ]
  pull_request:
    branches: [ development, master ]

jobs:
  test-linux-build:
    name: Linux Build + Static Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn package tarballs
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-v2-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-electron-v2-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done

      - name: Check AI workflows
        run: |
          yarn ai-workflow:check
          yarn ai-workflow:test

      - name: Lint and module boundaries
        run: yarn lint

      - name: React Doctor diagnostics
        run: yarn doctor:check
        env:
          PERF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}

      - name: Build React App
        run: yarn build
        env:
          CI: ''

      - name: Check startup asset ceiling
        run: yarn perf:startup-bytes

      - name: Verify production excludes React development instrumentation
        run: |
          if grep -rlE "__REACT_PERF__|agentation-dev-tools|data-feedback-toolbar|__ELEMENT_SOURCE__" build/assets; then
            echo "::error::React profiling or development inspectors leaked into the production bundle"
            exit 1
          fi

      - name: Build Preload Script
        run: yarn build:preload

      - name: Verify build outputs
        run: |
          echo "=== Checking build/ directory ==="
          ls -la build/ || exit 1
          echo "=== Checking build/electron/preload.cjs ==="
          ls -la build/electron/preload.cjs || exit 1
          echo "=== Checking build/index.html ==="
          ls -la build/index.html || exit 1

      - name: Verify forge config
        run: |
          echo "=== forge.config.js exists ==="
          ls -la forge.config.js
          echo "=== Validating forge config can be loaded ==="
          node -e "import('./forge.config.js').then(c => console.log('Config loaded, makers:', c.default.makers?.length || 0)).catch(e => { console.error(e); process.exit(1); })"

      # same toolchain as the release Linux builds; see the CC/CXX note in release.yml
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang-15

      - name: Package Electron App
        timeout-minutes: 30
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          set -o pipefail
          yarn electron-forge package 2>&1 | tee forge-output.log
          echo "=== Checking out/ directory ==="
          ls -la out/

      - name: Verify Executable
        run: |
          ls -la out/
          EXE=$(node scripts/find-forge-executable.js)
          echo "Found executable: $EXE"
          # Verify the file exists and is executable
          test -f "$EXE" && test -x "$EXE" && echo "✓ Executable is valid"

  perf-runtime:
    name: React Runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn package tarballs
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done

      - name: Install current stable Chrome
        run: yarn perf:install --force --with-deps

      - name: Check React collector and runtime scenarios
        run: yarn perf:check --output .react-perf/ci

      - name: Upload React runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-performance-runtime
          path: .react-perf/ci
          include-hidden-files: true
          if-no-files-found: warn

  perf-load:
    name: Cold Load
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn package tarballs
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done

      # Build locally so cold-load checks can start without waiting for packaging.
      - name: Build React App
        run: yarn build
        env:
          CI: ''

      - name: Install current stable Chrome
        run: yarn perf:install --force --with-deps

      - name: Check cold-load layout stability and static shell handoff
        run: yarn perf:load --check --profile cpu4 --samples 2 --output .react-perf/ci-load

      - name: Upload cold-load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-performance-load
          path: .react-perf/ci-load
          include-hidden-files: true
          if-no-files-found: warn

  # Preserve the existing required check while the Linux work runs in parallel.
  test-linux:
    name: Test Linux (Ubuntu)
    runs-on: ubuntu-22.04
    needs: [test-linux-build, perf-runtime, perf-load]
    if: always()
    steps:
      - name: Require every Linux check to pass
        env:
          BUILD_RESULT: ${{ needs.test-linux-build.result }}
          RUNTIME_RESULT: ${{ needs.perf-runtime.result }}
          LOAD_RESULT: ${{ needs.perf-load.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" || "$RUNTIME_RESULT" != "success" || "$LOAD_RESULT" != "success" ]]; then
            echo "::error::Linux checks did not all pass (build=$BUILD_RESULT, runtime=$RUNTIME_RESULT, load=$LOAD_RESULT)"
            exit 1
          fi

  test-mac-intel:
    name: Test Mac (Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn package tarballs
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-

      - name: Install setuptools for native modules
        run: pip3 install --break-system-packages setuptools || pip3 install --user setuptools || true

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-v2-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-electron-v2-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done

      - name: Build React App
        run: yarn build
        env:
          CI: ''

      - name: Build Preload Script
        run: yarn build:preload

      - name: Verify build outputs
        run: |
          ls -la build/ || exit 1
          ls -la build/electron/preload.cjs || exit 1
          ls -la build/index.html || exit 1

      - name: Package Electron App
        timeout-minutes: 30
        run: |
          set -o pipefail
          yarn electron-forge package 2>&1 | tee forge-output.log
          ls -la out/

      - name: Verify Executable
        run: |
          ls -la out/
          EXE=$(node scripts/find-forge-executable.js)
          echo "Found executable: $EXE"
          test -f "$EXE" && test -x "$EXE" && echo "✓ Executable is valid"

  test-mac-arm:
    name: Test Mac (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn package tarballs
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-

      - name: Install setuptools for native modules
        run: pip3 install --break-system-packages setuptools || pip3 install --user setuptools || true

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-v2-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-electron-v2-

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done

      - name: Build React App
        run: yarn build
        env:
          CI: ''

      - name: Build Preload Script
        run: yarn build:preload

      - name: Verify build outputs
        run: |
          ls -la build/ || exit 1
          ls -la build/electron/preload.cjs || exit 1
          ls -la build/index.html || exit 1

      - name: Package Electron App
        timeout-minutes: 30
        run: |
          set -o pipefail
          yarn electron-forge package 2>&1 | tee forge-output.log
          ls -la out/

      - name: Verify Executable
        run: |
          ls -la out/
          EXE=$(node scripts/find-forge-executable.js)
          echo "Found executable: $EXE"
          test -f "$EXE" && test -x "$EXE" && echo "✓ Executable is valid"

  test-windows:
    name: Test Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Resolve Yarn cache path
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn package tarballs
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-v2-

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-v2-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-electron-v2-

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "yarn install attempt $i"
            yarn install --immutable && break
            sleep 5
            [ "$i" = "3" ] && exit 1
          done

      - name: Build React App
        shell: bash
        run: yarn build
        env:
          CI: ''

      - name: Build Preload Script
        shell: bash
        run: yarn build:preload

      - name: Verify build outputs
        shell: bash
        run: |
          ls -la build/ || exit 1
          ls -la build/electron/preload.cjs || exit 1
          ls -la build/index.html || exit 1

      - name: Package Electron App
        shell: bash
        # a stalled native rebuild hangs silently instead of failing, so keep the cap close to the normal run time
        timeout-minutes: 15
        run: |
          set -o pipefail
          yarn electron-forge package 2>&1 | tee forge-output.log
          ls -la out/

      - name: Verify Executable
        shell: bash
        run: |
          ls -la out/
          EXE=$(node scripts/find-forge-executable.js)
          echo "Found executable: $EXE"
          test -f "$EXE" && test -x "$EXE" && echo "✓ Executable is valid"
