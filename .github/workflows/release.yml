# docs https://github.com/marketplace/actions/create-release
# docs https://github.com/ncipollo/release-action
# docs https://docs.github.com/en/actions/using-jobs/choosing-the-runner-for-a-job#choosing-github-hosted-runners
#
# Build jobs stage their Electron Forge (out/make) and APK outputs into dist/ under the
# asset names bitsocial.net's download links match, and upload them as workflow artifacts.
# finalize-release publishes every asset at once, so a failed build job leaves no partial
# "Latest" release without native downloads.

name: release

on:
  push:
    tags:
      - 'v*'
  # Dry run: builds and uploads workflow artifacts; finalize-release only runs for a pushed v* tag.
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          # better-sqlite3 is compiled from source, which node-gyp cannot cross-compile from an x64 runner
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # makes the electron/download-ipfs step fetch the target arch's kubo
      SEEDIT_BUILD_ARCH: ${{ matrix.arch }}
      # Electron 44 has no better-sqlite3 prebuild. Jammy's GCC 11/12 cannot parse its V8 headers, and a newer
      # distro would raise the AppImage's glibc floor, so compile with jammy's clang against its own libstdc++.
      CC: clang-15
      CXX: clang++-15
    steps:
      # electron build
      - uses: actions/checkout@v2
        with:
          # needed for git commit history changelog
          fetch-depth: 0
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang-15
      - name: Setup Node.js v22
        uses: actions/setup-node@v2
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies (with Node v22)
        run: yarn install --immutable
      # make sure the ipfs executable is executable
      - name: Download IPFS and set permissions (with Node v22)
        run: node electron/download-ipfs && sudo chmod +x bin/linux/ipfs
      - name: Build React app (with Node v22)
        run: CI='' NODE_ENV=production yarn build
      - name: Build Electron app for Linux (arm64)
        if: ${{ matrix.arch == 'arm64' }}
        run: yarn electron:build:linux:arm64
      - name: Build Electron app for Linux (x64)
        if: ${{ matrix.arch == 'x64' }}
        run: yarn electron:build:linux:x64
      - name: Stage release artifacts
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          SUFFIX=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then SUFFIX="-arm64"; fi
          APPIMAGE_PATH=$(find out/make -name '*.AppImage' | head -n 1)
          [ -n "$APPIMAGE_PATH" ] || { echo "::error::No AppImage in out/make"; exit 1; }
          mkdir -p dist
          cp "$APPIMAGE_PATH" "dist/seedit-${VERSION}${SUFFIX}.AppImage"
      - name: Create signed release manifest
        if: ${{ matrix.arch == 'x64' }}
        env:
          RELEASE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_PEM }}
          RELEASE_MANIFEST_KEY_ID: seedit-release-p256-2026-05
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          HTML_ARCHIVE_DIR="seedit-html-$VERSION"
          rm -rf "$HTML_ARCHIVE_DIR"
          yarn release:manifest --build-dir build --out-dir dist
          cp -R build "$HTML_ARCHIVE_DIR"
          cp dist/seedit-release-manifest.json "$HTML_ARCHIVE_DIR/seedit-release-manifest.json"
          cp dist/seedit-release-manifest.sig.json "$HTML_ARCHIVE_DIR/seedit-release-manifest.sig.json"
          rm -f "dist/${HTML_ARCHIVE_DIR}.zip"
          zip -r "dist/${HTML_ARCHIVE_DIR}.zip" "$HTML_ARCHIVE_DIR"
          rm -rf "$HTML_ARCHIVE_DIR"
      - name: List dist directory
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel # Intel x64
            arch: x64
          - runner: macos-latest # Apple Silicon arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      # electron build
      - uses: actions/checkout@v2
        with:
          # needed for git commit history changelog
          fetch-depth: 0
      - name: Setup Node.js v22
        uses: actions/setup-node@v2
        with:
          node-version: 22
      - run: corepack enable
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # install missing dep for sqlite (use setup-python to avoid PEP 668 externally-managed-environment error)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install setuptools

      - name: Install dependencies (with Node v22)
        run: yarn install --immutable
      # make sure the ipfs executable is executable
      - name: Download IPFS and set permissions (with Node v22)
        run: node electron/download-ipfs && sudo chmod +x bin/mac/ipfs
      - name: Build React app (with Node v22)
        run: CI='' NODE_ENV=production yarn build
      - name: Build Electron app for Mac (with Node v22)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            yarn electron:build:mac:arm64
          else
            yarn electron:build:mac:x64
          fi
      - name: Stage release artifacts
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          SUFFIX=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then SUFFIX="-arm64"; fi
          DMG_PATH=$(find out/make -name '*.dmg' | head -n 1)
          [ -n "$DMG_PATH" ] || { echo "::error::No DMG in out/make"; exit 1; }
          mkdir -p dist
          cp "$DMG_PATH" "dist/seedit-${VERSION}${SUFFIX}.dmg"
      - name: List dist directory
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      # electron build
      - uses: actions/checkout@v2
        with:
          # needed for git commit history changelog
          fetch-depth: 0
      - name: Setup Node.js v22
        uses: actions/setup-node@v2
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies (with Node v22)
        run: yarn install --immutable
      - name: Build React app (with Node v22)
        run: npx cross-env NODE_ENV=production yarn build
      - name: Build Electron app for Windows (x64)
        run: yarn electron:build:windows
      - name: Stage release artifacts
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          SETUP_EXE_PATH=$(find out/make -iname '*setup*.exe' | head -n 1)
          [ -n "$SETUP_EXE_PATH" ] || { echo "::error::No Squirrel Setup.exe in out/make"; exit 1; }
          mkdir -p dist
          cp "$SETUP_EXE_PATH" "dist/seedit.Setup.${VERSION}.exe"
      - name: List dist directory
        shell: bash
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v2
        with:
          # needed to use 'git tag' and get all tags and for git commit history changelog
          fetch-depth: 0
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
      - uses: actions/setup-node@v2
        with:
          node-version: 22
      - run: corepack enable
      - run: sudo apt install -y apksigner zipalign

      # install all dependencies (including devDependencies needed for React build)
      - name: Install dependencies (with Node v22)
        run: yarn install --immutable
      # build react app
      - run: CI='' NODE_ENV=production yarn build
      # set android versionCode and versionName
      - run: sed -i "s/versionCode 1/versionCode $(git tag | wc -l)/" ./android/app/build.gradle
      - run: sed -i "s/versionName \"1.0\"/versionName \"$(node -e "console.log(require('./package.json').version)")\"/" ./android/app/build.gradle
      - run: cat ./android/app/build.gradle
      # build apk
      - run: npx cap sync android
      - run: cd android && gradle bundle
      - run: cd android && ./gradlew assembleRelease --stacktrace
      # optimize apk
      - run: cd android/app/build/outputs/apk/release && zipalign 4 app-release-unsigned.apk app-release-unsigned-zip.apk
      # sign apk
      # to create keystore: keytool -genkey -v -keystore bitsocial.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias release
      - name: Check Android signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BITSOCIAL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::BITSOCIAL_KEYSTORE_PASSWORD is required to sign the Android release APK with android/bitsocial.keystore."
            exit 1
          fi
      # env: keeps the password out of the process argument list
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BITSOCIAL_KEYSTORE_PASSWORD }}
        run: cd android/app/build/outputs/apk/release && apksigner sign --ks ../../../../../bitsocial.keystore --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias release --out app-release-signed.apk app-release-unsigned-zip.apk
      - name: Verify APK signature
        run: cd android/app/build/outputs/apk/release && apksigner verify --verbose --print-certs app-release-signed.apk
      # move apk to dist folder
      - run: mkdir -p dist && mv android/app/build/outputs/apk/release/app-release-signed.apk dist/seedit-$(node -e "console.log(require('./package.json').version)").apk
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/
          if-no-files-found: error

  finalize-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    needs: [linux, mac, windows, android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Setup Node.js v22
        uses: actions/setup-node@v2
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: List all release assets
        run: ls -la dist
      # release-body lists dist/ when the tag has no GitHub release yet
      - name: Generate release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/release-body > release-body.txt
      # fail before publishing, so a release never ships without its seedit.app deploy
      - name: Check Vercel deployment token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is required to deploy the release HTML archive to Vercel Production."
            exit 1
          fi
      # immutableCreate creates a new release as a draft and publishes it only after the uploads;
      # artifactErrorsFailBuild makes a failed upload fail the job, leaving the draft unpublished
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'dist/*'
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          immutableCreate: true
          bodyFile: "release-body.txt"
      # production is release-artifact only (the Vercel project skips Git builds from master),
      # so seedit.app gets the exact published seedit-html archive
      - name: Deploy web release to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_drHWHjDIQypSvbjZ1F468uLm
          VERCEL_PROJECT_ID: prj_7InczAG5KXtc22pcjaWew6TCCwf7
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ASSET="dist/seedit-html-${VERSION}.zip"
          STAGED_DIR=$(node scripts/prepare-vercel-release-deploy.mjs --tag "$GITHUB_REF_NAME" --asset "$RELEASE_ASSET" --out-dir vercel-release-deploy)
          corepack yarn dlx vercel@50.23.2 deploy "$STAGED_DIR" \
            --prebuilt \
            --prod \
            --yes \
            --force \
            --archive=tgz \
            --token "$VERCEL_TOKEN" \
            --meta source=github-release \
            --meta releaseTag="$GITHUB_REF_NAME" \
            --meta releaseAsset="seedit-html-${VERSION}.zip"
